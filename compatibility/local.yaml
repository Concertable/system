# Known-good composition for a local or CI qualification run of the Concertable system.
#
# src/Concertable.AppHost reads this file and fails composition if an image is missing, so this is
# the only place a pin is edited and no second list can drift from what actually runs. Renovate
# raises the digest and package bumps here (checkpoint 9C).

version: 1

# Until each service publishes its own release train, the system qualifies against artefacts the
# monorepo produced. Every image below was built from this one commit.
source:
  repository: Concertable/concertable
  commit: d6f986c2570d994891767bcb1a10fd797d2b854e

# One version cannot describe the composition, because the platform and each service publish on their
# own train. Directory.Packages.props owns that rule and declares the trains; ReleaseTrainPinTests holds
# these equal to it.
platform:
  packages: 0.2.0-alpha.0.5

services:
  auth: 0.2.0-alpha.0.297
  b2b: 0.2.0-alpha.0.292
  customer: 0.2.0-alpha.0.338
  payment: 0.2.0-alpha.0.372
  search: 0.2.0-alpha.0.324

