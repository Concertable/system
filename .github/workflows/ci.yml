name: CI

# Build and the container-free tiers. Booting the composed system is qualify.yml, which needs a
# Docker host and read access to the pinned GHCR images, so it never gates a plain push.
#
# The org's reusable dotnet-ci.yml is deliberately not used here: it supplies NUGET_AUTH_TOKEN, and
# this repository's nuget.config authenticates the org feed with GITHUB_PACKAGES_TOKEN so that one
# credential name works both locally and in CI. A reusable workflow's steps cannot be handed extra
# env by its caller, so the build runs here instead.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_PACKAGES_TOKEN: ${{ secrets.CONCERTABLE_PACKAGES_TOKEN }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Require the feed credential
        # Without this the missing secret surfaces minutes later as NU1301 403 on a Concertable.*
        # restore, which reads as a broken feed rather than an unset secret.
        run: test -n "$GITHUB_PACKAGES_TOKEN" || { echo "CONCERTABLE_PACKAGES_TOKEN is not set on this repository."; exit 1; }

      - name: Restore
        run: dotnet restore Concertable.System.slnx

      - name: Build
        run: dotnet build Concertable.System.slnx --configuration Release --no-restore

      - name: Unit tier
        run: |
          for project in \
            tests/payment/Concertable.Payment.E2ETests.Helpers.UnitTests \
            tests/search/Concertable.Search.E2ETests.Helpers.UnitTests
          do
            dotnet test "$project" --configuration Release --no-build
          done

      - name: Architecture and startup tiers
        run: |
          for project in \
            tests/shared/Concertable.AppHost.ArchitectureTests \
            tests/shared/Concertable.AppHost.StartupTests
          do
            dotnet test "$project" --configuration Release --no-build
          done

  pins:
    name: Composition pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Manifest and package pin agree
        run: python .github/scripts/check_pins.py
