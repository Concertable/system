name: Qualify

# Boots the composed system from the images pinned in compatibility/local.yaml and probes it from
# outside. Kept off the push path: it needs a Docker host and read access to those images, so a
# failure here is a statement about the pinned composition, never about an unrelated edit.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  packages: read

concurrency:
  group: qualify-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_PACKAGES_TOKEN: ${{ secrets.CONCERTABLE_PACKAGES_TOKEN }}

jobs:
  qualify:
    name: Black-box qualification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Require the feed credential
        # Without this the missing secret surfaces as a GHCR 403 on the pull, or NU1301 403 on the
        # restore, either of which reads as a broken registry rather than an unset secret.
        run: test -n "$GITHUB_PACKAGES_TOKEN" || { echo "CONCERTABLE_PACKAGES_TOKEN is not set on this repository."; exit 1; }

      # Concertable.Auth.Hosting hands the Auth container the ASP.NET Core development
      # certificate, so one has to exist on the runner. Without it Auth binds nothing on the
      # port declared https, the proxy accepts the connection and never answers, and the whole
      # composition reads as unhealthy for no stated reason.
      - name: Provision the HTTPS developer certificate
        # OpenSSL only honours the trust directory once it is already on SSL_CERT_DIR, so exporting it
        # after asking for trust left the certificate generated but untrusted, and
        # WithHttpsDeveloperCertificate refuses an untrusted one: Auth then reached FailedToStart with
        # no stated reason and every service waiting on it followed.
        run: |
          export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:/etc/ssl/certs:/usr/lib/ssl/certs"
          echo "SSL_CERT_DIR=$SSL_CERT_DIR" >> "$GITHUB_ENV"
          dotnet dev-certs https --trust
          dotnet dev-certs https --check --trust

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.CONCERTABLE_PACKAGES_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Pull before the suite so a missing or unreadable image fails as itself rather than as an
      # Aspire start timeout minutes later.
      - name: Pull the pinned images
        run: |
          python - <<'PY' > images.txt
          import re
          manifest = open('compatibility/local.yaml', encoding='utf-8').read()
          for repository, digest in re.findall(
                  r'^\s+repository:\s*(\S+)\s*\n\s+digest:\s*(\S+)\s*$', manifest, re.MULTILINE):
              print(f'{repository}@{digest}')
          PY
          cat images.txt
          xargs -r -n1 docker pull < images.txt

      # Partitions an image fault from a composition fault. Auth reaches FailedToStart before any
      # container output exists and the orchestrator records no reason, so prove the artefact runs on
      # its own before blaming the composition that hosts it.
      - name: Smoke the pinned Auth image on its own
        run: |
          image=$(grep -A2 '^  auth:' compatibility/local.yaml | sed -n 's/.*repository: *//p')
          digest=$(grep -A2 '^  auth:' compatibility/local.yaml | sed -n 's/.*digest: *//p')
          echo "smoking $image@$digest"
          docker run -d --name auth-smoke -e ASPNETCORE_ENVIRONMENT=E2E -p 18080:8080 "$image@$digest"
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/health || true)
            echo "attempt $attempt: HTTP ${code:-none}"
            if [ "$code" = "200" ]; then break; fi
            sleep 3
          done
          echo "--- state ---"
          docker inspect --format '{{.State.Status}} exit={{.State.ExitCode}} err={{.State.Error}}' auth-smoke
          echo "--- last 60 log lines ---"
          docker logs --tail 60 auth-smoke 2>&1 || true
          docker rm -f auth-smoke > /dev/null

      - name: Restore and build
        run: |
          dotnet restore Concertable.System.slnx
          dotnet build Concertable.System.slnx --configuration Release --no-restore

      - name: Qualify
        run: >
          dotnet test tests/shared/Concertable.Qualification.E2ETests
          --configuration Release --no-build --logger "trx;LogFileName=qualify.trx"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-results
          path: |
            **/TestResults/*.trx
            **/*-diagnostics.log
          if-no-files-found: warn
